specVersion: v0.1.0
package:
  name: ekubo_v3
  version: v0.1.0
  url: https://github.com/EkuboProtocol/subgraph/tree/main/substreams
  description: Every log of the Ekubo v3 contracts on Ethereum and Arbitrum One, decoded, in chain order, including swaps and the other logs without topics.
  doc: ./README.md
  image: ./ekubo.png

imports:
  ethereum_common: https://github.com/streamingfast/substreams-foundational-modules/releases/download/ethereum-common-v0.3.3/ethereum-common-v0.3.3.spkg

protobuf:
  files:
    - ekubo/v3/events.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/ekubo_v3_substreams.wasm

modules:
  - name: map_events
    kind: map
    # Skips blocks without a log from any Ekubo v3 contract. Keep this list in
    # sync with src/addresses.rs.
    blockFilter:
      module: ethereum_common:index_events
      query:
        string: "evt_addr:0x00000000000014aa86c5d3c41765bb24e11bd701 || evt_addr:0x517e506700271aea091b02f42756f5e174af5230 || evt_addr:0xd4f1060cb9c1a13e1d2d20379b8aa2cf7541ed9b || evt_addr:0xd47f1b1edcfeabb08f6ebd8fc337c27e636c75ba || evt_addr:0xd4b54d0ca6979da05f25895e6e269e678ba00f9e || evt_addr:0x948b9c2c99718034954110cb61a6e08e107745f9 || evt_addr:0x02d9876a21af7545f8632c3af76ec90b5ad4b66d || evt_addr:0xa2971e0c37cfdb13ae8440a0c94ef1a1af39e326 || evt_addr:0xff6cf0ca6d7a30a60539acd4bb20b3df84ea0644 || evt_addr:0x3325428adb409c239e88ca472f50b0efe00e98b4 || evt_addr:0x9bb520b6192f71ec3d015c8a74f914f9c94bf794 || evt_addr:0xcb4e1b5fb7b120db0815afa63453c969136c0ec9 || evt_addr:0xc52d2656cb8c634263e6a15469588beb9c3bb738 || evt_addr:0xaa166592922c4020cefa23448054ad070211790a"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:ekubo.v3.Events
    doc: Every log of the Ekubo v3 contracts in the block, decoded.

network: mainnet

networks:
  mainnet:
    initialBlock:
      map_events: 24134507
  arbitrum-one:
    initialBlock:
      map_events: 416469410
