# Oracle extension, emitted as a log without topics.

type OracleSnapshot implements Event @entity(immutable: true) {
  id: Bytes!
  blockNumber: BigInt!
  transactionIndex: BigInt!
  eventIndex: BigInt!
  blockHash: Bytes!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  emitter: Bytes!

  # Oracle pools pair the native token (address zero) with this token.
  token: Bytes! # address
  timestamp: BigInt! # uint32
  secondsPerLiquidityCumulative: BigInt! # uint160
  tickCumulative: BigInt! # int64
}

