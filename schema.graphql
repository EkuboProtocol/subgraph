# Every entity below is one onchain log, stored as emitted, so that the full
# history of the protocol can be replayed in order. The id of every event is
# 16 bytes: the block number (8 bytes), the transaction index (4 bytes) and the
# log index within the block (4 bytes), all big-endian, so ordering by id is
# chain order across every event type.
interface Event {
  id: Bytes!
  blockNumber: BigInt!
  transactionIndex: BigInt!
  eventIndex: BigInt!
  blockHash: Bytes!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  emitter: Bytes! # address
}

# Core

type PoolInitialization implements Event @entity(immutable: true) {
  id: Bytes!
  blockNumber: BigInt!
  transactionIndex: BigInt!
  eventIndex: BigInt!
  blockHash: Bytes!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  emitter: Bytes!

  coreAddress: Bytes! # address, same as emitter
  poolId: Bytes! # bytes32
  token0: Bytes! # address
  token1: Bytes! # address
  config: Bytes! # bytes32
  extension: Bytes! # address
  fee: BigInt! # uint64, a fraction of 2**64
  tickSpacing: Int # uint32, set for concentrated pools
  stableswapAmplification: Int # uint8, set for stableswap pools
  stableswapCenterTick: Int # int32, set for stableswap pools
  tick: Int! # int32
  sqrtRatio: BigInt! # fixed point 64.128
}

# The Core emits swaps as a log without topics. See src/receipt.ts.
type Swap implements Event @entity(immutable: true) {
  id: Bytes!
  blockNumber: BigInt!
  transactionIndex: BigInt!
  eventIndex: BigInt!
  blockHash: Bytes!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  emitter: Bytes!

  locker: Bytes! # address
  poolId: Bytes! # bytes32
  delta0: BigInt! # int128, positive when the pool receives token0
  delta1: BigInt! # int128
  liquidityAfter: BigInt! # uint128
  sqrtRatioAfter: BigInt! # fixed point 64.128
  tickAfter: Int! # int32
}

type PositionUpdate implements Event @entity(immutable: true) {
  id: Bytes!
  blockNumber: BigInt!
  transactionIndex: BigInt!
  eventIndex: BigInt!
  blockHash: Bytes!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  emitter: Bytes!

  locker: Bytes! # address, the owner of the position in Core
  poolId: Bytes! # bytes32
  positionId: Bytes! # bytes32
  salt: BigInt! # uint192
  lowerTick: Int! # int32
  upperTick: Int! # int32
  liquidityDelta: BigInt! # int128
  delta0: BigInt! # int128, positive when the pool receives token0
  delta1: BigInt! # int128
  liquidityAfter: BigInt! # uint128, active liquidity of the pool after the update
  sqrtRatioAfter: BigInt! # fixed point 64.128
  tickAfter: Int! # int32
}

